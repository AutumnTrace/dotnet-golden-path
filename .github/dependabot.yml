version: 2
updates:
  # The template's own tooling (template tests).
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      test:
        patterns: ["xunit*", "coverlet.*", "Microsoft.NET.Test.Sdk"]

  # What every generated service starts with: keeping these current is the point of a golden path.
  - package-ecosystem: nuget
    directory: /templates/goldenpath-api
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # The template targets the .NET 10 LTS line. Framework-aligned packages move to the next major together
    # with the TargetFramework, in one deliberate change, not one package at a time.
    ignore:
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "EFCore.NamingConventions"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Serilog.AspNetCore"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet-ef"
        update-types: ["version-update:semver-major"]
    groups:
      opentelemetry:
        patterns: ["OpenTelemetry*", "Azure.Monitor.*", "Npgsql.OpenTelemetry"]
      aspnetcore:
        patterns: ["Microsoft.AspNetCore.*", "Microsoft.EntityFrameworkCore*", "Microsoft.Extensions.*", "Npgsql*", "Asp.Versioning.*"]
      test:
        patterns: ["xunit*", "coverlet.*", "Microsoft.NET.Test.Sdk", "Testcontainers*", "Verify*", "TngTech.*"]
      serilog:
        patterns: ["Serilog*"]

  - package-ecosystem: github-actions
    directories: ["/", "/templates/goldenpath-api"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The base images of generated services.
  - package-ecosystem: docker
    directory: /templates/goldenpath-api
    schedule:
      interval: monthly
