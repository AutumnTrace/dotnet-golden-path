name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  KUBECONFORM_VERSION: v0.8.0
  ACTIONLINT_VERSION: 1.7.12

jobs:
  template:
    name: Template tests and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Release

      - name: Template tests (every combination, generated files only)
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=template-tests.trx"

      - name: Pack
        run: dotnet pack src/GoldenPath.Templates -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: template-package
          path: artifacts/*.nupkg
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: template-test-results
          path: tests/**/TestResults/*.trx

  # Every one of the 24 combinations must build with zero warnings and pass its unit, API and architecture tests.
  combinations:
    name: All combinations (${{ matrix.database }} db, ${{ matrix.messaging }} messaging)
    needs: template
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [postgres, none]
        messaging: [kafka, none]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          name: template-package
          path: artifacts

      - name: Install the packed template
        run: dotnet new install artifacts/GoldenPath.Templates.*.nupkg

      - name: Build and test observability x auth
        run: |
          set -euo pipefail
          for observability in otlp appinsights both; do
            for auth in jwt none; do
              args="--database ${{ matrix.database }} --messaging ${{ matrix.messaging }} --observability $observability --auth $auth"
              dir="$RUNNER_TEMP/svc-$observability-$auth"
              echo "::group::$args"
              dotnet new goldenpath-api -n Orders -o "$dir" $args
              dotnet build "$dir" -c Release
              dotnet test "$dir" -c Release --no-build --filter "Category!=Integration"
              echo "::endgroup::"
            done
          done

  # A pairwise-covering set (every pair of option values appears at least once) plus the "everything on"
  # combination, each taken through the whole pipeline a team would run.
  service:
    name: Service (${{ matrix.name }})
    needs: template
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: full, database: postgres, messaging: kafka, observability: both, auth: jwt }
          - { name: p-k-otlp-jwt, database: postgres, messaging: kafka, observability: otlp, auth: jwt }
          - { name: x-x-otlp-none, database: none, messaging: none, observability: otlp, auth: none }
          - { name: p-x-ai-none, database: postgres, messaging: none, observability: appinsights, auth: none }
          - { name: x-k-ai-jwt, database: none, messaging: kafka, observability: appinsights, auth: jwt }
          - { name: p-x-both-jwt, database: postgres, messaging: none, observability: both, auth: jwt }
          - { name: x-k-both-none, database: none, messaging: kafka, observability: both, auth: none }
    env:
      # Outside the checkout, so the generated service does not inherit this repo's Directory.Build.props.
      SERVICE_DIR: /home/runner/work/svc
      TEMPLATE_ARGS: --database ${{ matrix.database }} --messaging ${{ matrix.messaging }} --observability ${{ matrix.observability }} --auth ${{ matrix.auth }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          name: template-package
          path: artifacts

      - name: Install the packed template
        run: dotnet new install artifacts/GoldenPath.Templates.*.nupkg

      - name: Generate the service
        run: dotnet new goldenpath-api -n Orders -o "$SERVICE_DIR" $TEMPLATE_ARGS

      - name: Build
        working-directory: ${{ env.SERVICE_DIR }}
        run: dotnet build -c Release

      - name: Unit, API and architecture tests
        working-directory: ${{ env.SERVICE_DIR }}
        run: dotnet test -c Release --no-build --filter "Category!=Integration" --logger "trx;LogFileName=unit.trx"

      - name: Integration tests (Testcontainers)
        if: matrix.database != 'none' || matrix.messaging != 'none'
        working-directory: ${{ env.SERVICE_DIR }}
        run: dotnet test -c Release --no-build --filter "Category=Integration" --logger "trx;LogFileName=integration.trx"

      - name: Lint the generated GitHub Actions workflow
        run: |
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | tar xz actionlint
          ./actionlint "$SERVICE_DIR/.github/workflows/ci.yml"

      - name: Build the container image
        working-directory: ${{ env.SERVICE_DIR }}
        run: docker build -t orders:ci .

      - name: Validate docker-compose.yml
        working-directory: ${{ env.SERVICE_DIR }}
        run: docker compose config --quiet

      - uses: azure/setup-helm@v5

      - name: Lint the Helm chart
        working-directory: ${{ env.SERVICE_DIR }}
        run: helm lint deploy/helm/orders --strict

      - name: Validate rendered manifests (kubeconform)
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz kubeconform
          helm template orders deploy/helm/orders | ./kubeconform -strict -summary -kubernetes-version 1.33.0

      - name: Run the compose stack end to end
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          docker compose up -d --build --wait --wait-timeout 300
          "$GITHUB_WORKSPACE/eng/smoke-test.sh" http://localhost:8080 ${{ matrix.auth }}

      - name: Compose logs
        if: failure()
        working-directory: ${{ env.SERVICE_DIR }}
        run: docker compose logs --no-color

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: service-test-results-${{ matrix.name }}
          path: ${{ env.SERVICE_DIR }}/tests/**/TestResults/*.trx

  # The default template output, deployed with its own Helm chart to a real (kind) Kubernetes cluster.
  kubernetes:
    name: Deploy to Kubernetes (kind)
    needs: template
    runs-on: ubuntu-latest
    env:
      SERVICE_DIR: /home/runner/work/svc
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          name: template-package
          path: artifacts

      - name: Generate the service with default options
        run: |
          dotnet new install artifacts/GoldenPath.Templates.*.nupkg
          dotnet new goldenpath-api -n Orders -o "$SERVICE_DIR"

      - name: Build the image
        run: docker build -t orders:kind "$SERVICE_DIR"

      - uses: helm/kind-action@v1
        with:
          cluster_name: golden-path

      - uses: azure/setup-helm@v5

      - name: Load the image and start PostgreSQL
        run: |
          kind load docker-image orders:kind --name golden-path
          kubectl apply -f eng/kind/postgres.yaml
          kubectl rollout status deployment/postgres --timeout=180s
          kubectl create secret generic orders-secrets \
            --from-literal=ConnectionStrings__Database='Host=postgres;Database=orders;Username=orders;Password=orders'

      - name: helm install --wait
        run: |
          helm install orders "$SERVICE_DIR/deploy/helm/orders" \
            --set image.repository=orders \
            --set image.tag=kind \
            --set existingSecret=orders-secrets \
            --set config.Database__MigrateOnStartup=true \
            --set config.Authentication__Schemes__Bearer__Authority=https://identity.example.test/ \
            --wait --timeout 5m

      - name: helm test (readiness from inside the cluster)
        run: helm test orders --logs

      - name: Probe through a port-forward
        run: |
          kubectl port-forward service/orders 8080:80 &
          sleep 3
          curl -fsS http://localhost:8080/health/ready | tee ready.json
          grep -q '"name":"database","status":"Healthy"' ready.json
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/orders)" = 401

      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe pods -l app.kubernetes.io/instance=orders
          kubectl logs -l app.kubernetes.io/instance=orders --tail=200 --all-containers
