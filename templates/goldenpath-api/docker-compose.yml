# Local stack: the service, its infrastructure and a telemetry UI.
#   docker compose up --build
# API:        http://localhost:8080   (try /health/ready and /openapi/v1.json)
#if (UseOtlp)
# Telemetry:  http://localhost:18888  (Aspire dashboard: traces, metrics and structured logs)
#endif
name: company-service

services:
  api:
    build: .
    image: company-service:local
    ports:
      - "8080:8080"
    environment:
      # The image never contains appsettings.Development.json, so local-only settings are spelled out here.
      ASPNETCORE_ENVIRONMENT: Development
      Observability__LogFormat: Text
      CustomerDirectory__UseStub: "true"
#if (UseJwt)
      # POST http://localhost:8080/dev/tokens returns a JWT for local calls (Development only).
      Authentication__DevelopmentTokens__Enabled: "true"
      Authentication__DevelopmentTokens__SigningKey: development-only-9b3e2f6a-41c8-4d07-a5e1-7c2d9f80b6a4-3f1c7e52-8d94-4b6a-9e0f-2a5c71d8e3b9
#endif
#if (UsePostgres)
      Database__Provider: Postgres
      Database__MigrateOnStartup: "true"
      ConnectionStrings__Database: Host=postgres;Database=company_service;Username=app;Password=app
#endif
#if (UseKafka)
      Messaging__Provider: Kafka
      Messaging__BootstrapServers: kafka:9092
      Messaging__CreateTopicsOnStartup: "true"
#endif
#if (UseOtlp)
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
#endif
#if (UseAppInsights)
      # Set it to export traces, metrics and logs to Application Insights.
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
#endif
    # Same hardening as the Helm chart: read-only root file system, writable /tmp only.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
#if (UseIntegrationTests)
    depends_on:
#if (UsePostgres)
      postgres:
        condition: service_healthy
#endif
#if (UseKafka)
      kafka:
        condition: service_healthy
#endif
#endif
#if (UsePostgres)

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: company_service
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d company_service"]
      interval: 5s
      timeout: 3s
      retries: 20
#endif
#if (UseKafka)

  kafka:
    image: apache/kafka:4.4.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
#endif
#if (UseOtlp)

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6
    environment:
      # Local only: no login screen.
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"
#endif
#if (UsePostgres)

volumes:
  postgres-data:
#endif
