name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build (warnings are errors)
        run: dotnet build --no-restore -c Release

      - name: Unit, API and architecture tests
        run: dotnet test --no-build -c Release --filter "Category!=Integration" --logger trx --collect "XPlat Code Coverage"
#if (UseIntegrationTests)

      - name: Integration tests (Testcontainers)
        run: dotnet test --no-build -c Release --filter "Category=Integration" --logger trx --collect "XPlat Code Coverage"
#endif

      - name: Coverage report
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        with:
          reports: tests/**/TestResults/**/coverage.cobertura.xml
          targetdir: coverage
          reporttypes: MarkdownSummaryGithub

      - name: Coverage summary
        if: always()
        run: cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: tests/**/TestResults/**

  container:
    name: Image, compose file and chart
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t company-service:${{ github.sha }} .

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - uses: azure/setup-helm@v5

      - name: Lint the chart
        run: helm lint deploy/helm/company-service --strict

      - name: Validate rendered manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          helm template company-service deploy/helm/company-service | ./kubeconform -strict -summary -kubernetes-version 1.33.0
